name: Fetch Notion Content

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Validate Notion configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PROP_PUBLISHED: ${{ vars.NOTION_PROP_PUBLISHED }}
          NOTION_PROP_DATE: ${{ vars.NOTION_PROP_DATE }}
          NOTION_PROP_TITLE: ${{ vars.NOTION_PROP_TITLE }}
          NOTION_PROP_SLUG: ${{ vars.NOTION_PROP_SLUG }}
          NOTION_PROP_EXCERPT: ${{ vars.NOTION_PROP_EXCERPT }}
          NOTION_PROP_TAGS: ${{ vars.NOTION_PROP_TAGS }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${NOTION_TOKEN:-}" ]] || missing+=(NOTION_TOKEN)
          [[ -n "${NOTION_DATABASE_ID:-}" ]] || missing+=(NOTION_DATABASE_ID)

          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing GitHub Actions secrets::Configure these repository secrets: ${missing[*]}"
            exit 1
          fi

          echo "Required Notion secrets are present."

      - run: npm ci

      - name: Fetch Notion content
        run: npm run fetch-content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Commit synced content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "content: sync from Notion"
          file_pattern: "src/content/blog/*.mdx"
